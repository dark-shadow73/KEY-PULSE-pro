<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyPulse - Redirecting</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Automatically fixes /dist/ or 404 routes back to canonical application root
      var path = window.location.pathname;
      if (path.includes('/dist')) {
        var target = path.replace(/\/dist\/?.*$/, '/') + window.location.search + window.location.hash;
        window.location.replace(target);
      } else {
        var repoMatch = path.match(/^(\/[^\/]+)/);
        var base = repoMatch ? repoMatch[1] + '/' : '/';
        window.location.replace(base + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body style="background-color: #020617; color: #94a3b8; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="font-size: 20px; font-weight: bold; color: #fbbf24; margin-bottom: 8px;">KeyPulse</div>
    <div>Loading application...</div>
  </body>
</html>

    <script>
      // If user landed on /dist/ directly, smoothly normalize URL back to root
      if (window.location.pathname.includes('/dist/')) {
        var normalized = window.location.pathname.replace(/\/dist\/?/, '/') + window.location.search + window.location.hash;
        if (window.location.pathname !== normalized) {
          window.location.replace(normalized);
        }
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-400/30 selection:text-amber-200 min-h-screen">

  </body>

<!DOCTYPE html>
<html lang="en" style="background-color: #020617; color: #f8fafc;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyPulse - Pro Typing</title>
    <style>
      body {
        margin: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .btn {
        margin-top: 16px;
        padding: 10px 20px;
        background: #f59e0b;
        color: #020617;
        font-weight: bold;
        border-radius: 12px;
        text-decoration: none;
      }
    </style>
    <script>
      // Single Page App redirect for GitHub Pages
      // If user landed on /dist/ or a deep subpath, route back to canonical app root
      var path = window.location.pathname;
      if (path.includes('/dist/')) {
        var clean = path.replace(/\/dist\/?.*$/, '/') + window.location.search + window.location.hash;
        window.location.replace(clean);
      }
    </script>
  </head>
  <body style="background-color: #020617; color: #f8fafc;">
    <div style="font-size: 24px; font-weight: 800; color: #f59e0b;">KeyPulse Pro</div>
    <p style="color: #94a3b8; font-size: 14px;">Loading typing speed arena...</p>
    <a href="./" class="btn">Open KeyPulse</a>
  </body>
</html>
